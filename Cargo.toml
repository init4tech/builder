[package]
name = "builder"
version = "1.0.0"
description = "signet builder example"

edition = "2024"
rust-version = "1.92"
authors = ["init4"]
license = "Apache-2.0 OR MIT"
homepage = "https://github.com/init4tech/builder"
repository = "https://github.com/init4tech/builder"

[features]
test-utils = []

[lib]
name = "builder"

[[bin]]
name = "zenith-builder-example"
path = "bin/builder.rs"

[dependencies]
init4-bin-base = { git = "https://github.com/init4tech/bin-base", rev = "b2f92e4", features = ["perms", "aws", "pylon"] }

signet-constants = { git = "https://github.com/init4tech/signet-sdk", rev = "ecce6a48a6af81c5f668c142b3a63452de02a146" }
signet-sim = { git = "https://github.com/init4tech/signet-sdk", rev = "ecce6a48a6af81c5f668c142b3a63452de02a146" }
signet-tx-cache = { git = "https://github.com/init4tech/signet-sdk", rev = "ecce6a48a6af81c5f668c142b3a63452de02a146" }
signet-types = { git = "https://github.com/init4tech/signet-sdk", rev = "ecce6a48a6af81c5f668c142b3a63452de02a146" }
signet-zenith = { git = "https://github.com/init4tech/signet-sdk", rev = "ecce6a48a6af81c5f668c142b3a63452de02a146" }
signet-genesis = { git = "https://github.com/init4tech/node-components", rev = "752fa4ad0956cf3a0b0d040402f40fc9b41b0fe8" }

trevm = { version = "0.34.0", features = ["concurrent-db", "test-utils", "asyncdb"] }

alloy = { version = "1.4.0", features = [
    "full",
    "json-rpc",
    "signer-aws",
    "rpc-types-mev",
    "rpc-client",
    "rpc-types-debug",
    "rlp",
    "node-bindings",
    "serde",
    "getrandom",
    "provider-mev-api",
] }

reth-chainspec = { git = "https://github.com/paradigmxyz/reth", tag = "v1.11.3" }

axum = "0.7.5"
backon = { version = "1.6.0", features = ["tokio-sleep"] }
eyre = "0.6.12"
futures-util = "0.3.31"
git-version = "0.3.9"
itertools = "0.14.0"
openssl = { version = "0.10", features = ["vendored"] }
reqwest = { version = "0.12.22", features = ["blocking", "json"] }
thiserror = "2.0.17"
tokio = { version = "1.36.0", features = ["full", "macros", "rt-multi-thread"] }
tokio-stream = "0.1.17"
tracing = "0.1.41"
url = "2.5.4"

[dev-dependencies]
alloy-hardforks = "0.4.0"
alloy-chains = "0.2"
criterion = { version = "0.8.2", features = ["async_tokio"] }
signet-bundle = { git = "https://github.com/init4tech/signet-sdk", rev = "ecce6a48a6af81c5f668c142b3a63452de02a146" }

[[bench]]
name = "sim"
path = "benches/sim/main.rs"
harness = false
required-features = ["test-utils"]

